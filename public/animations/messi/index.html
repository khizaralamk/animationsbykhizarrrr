  .oled {

    background: #000;
    border: 1px solid #2a2a2e;
    border-radius: 8px;
    line-height: 0;

  canvas {

    height: auto;
    image-rendering: pixelated;

  button {
    font: inherit;

    background: #17171a;
    border: 1px solid #34343a;

  button:hover { background: #222226; }
  button:focus-visible { outline: 2px solid #e8e6e1; outline-offset: 2px; }
  button[aria-pressed="true"] { background: #e8e6e1; color: #0b0b0c; border-color: #e8e6e1; }

  .code-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
  h2 { margin: 0; font-size: 14px; font-weight: 700; }
  #copy { border-radius: 6px; }
  .code-wrap {
    background: #121214;
    border: 1px solid #2a2a2e;
    border-radius: 8px;
    max-height: 280px;
    overflow: auto;
  }
  pre { margin: 0; padding: 14px; font-size: 12px; color: #b9b7b1; }

  .slider { display: flex; align-items: center; gap: 10px; }
  .slider input { width: 170px; accent-color: #e8e6e1; }

// Portrait is the same 128x64 screen turned upright (display.setRotation(1) on the Arduino).
// The logo is taller than wide, so portrait gives it more pixels. Landscape is the screen lying flat.
const SCREENS = { portrait: { w: 64, h: 128 }, landscape: { w: 128, h: 64 } };
let mode = "landscape";
let SCREEN_WIDTH = SCREENS[mode].w;
let SCREEN_HEIGHT = SCREENS[mode].h;
const SCALE = 5;              // how big one OLED pixel is on this page
const FPS = 30;

// Starting values. The controls on the page change them.
let pictureHeight = 79;       // picture height in OLED pixels (largest that fits the screen)
let style = "line";           // "line": the logo is lit, like the picture. "fill": dark logo on a lit box

const INK_LEVEL = 0.30;       // how bright a pixel of the logo must be to count as logo

// The picture stays still. Only a shine slides across it.
const SHINE_FRAMES = 22;      // how long the shine takes to cross the screen
const REST_FRAMES = 75;       // still picture between two shines
const SHINE_WIDTH = 4;        // wide stripe, in pixels
const SHINE_GAP = 3;          // gap before the thin second stripe
const SHINE_SLANT = 0.5;      // how much the stripes lean

const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const master = Uint8Array.from(atob(TRACE.ink), c => c.charCodeAt(0));
let lit = null;               // the still picture, one byte per OLED pixel
let shape = null;             // which pixels belong to the picture (the shine only touches these)
let frame = 0;

// Shrink the master trace to pictureHeight and centre it on the screen.
function buildPicture() {
  const scale = pictureHeight / TRACE.h;
  const pictureWidth = Math.round(TRACE.w * scale);
  const left = Math.floor((SCREEN_WIDTH - pictureWidth) / 2);
  const top = Math.floor((SCREEN_HEIGHT - pictureHeight) / 2);
  lit = new Uint8Array(SCREEN_WIDTH * SCREEN_HEIGHT);
  shape = new Uint8Array(SCREEN_WIDTH * SCREEN_HEIGHT);

  for (let y = 0; y < pictureHeight; y++) {
    const y0 = Math.floor(y / scale);
    const y1 = Math.min(TRACE.h, Math.max(y0 + 1, Math.round((y + 1) / scale)));
    for (let x = 0; x < pictureWidth; x++) {
      const x0 = Math.floor(x / scale);
      const x1 = Math.min(TRACE.w, Math.max(x0 + 1, Math.round((x + 1) / scale)));
      // Average the ink of all master pixels that land on this OLED pixel.
      let sum = 0;
      for (let my = y0; my < y1; my++) {
        for (let mx = x0; mx < x1; mx++) sum += master[my * TRACE.w + mx];
      }
      const isInk = sum / ((y1 - y0) * (x1 - x0)) / 255 > INK_LEVEL;
      const i = (top + y) * SCREEN_WIDTH + left + x;
      shape[i] = 1;
      // Line: the logo is lit. Fill: the box is lit and the logo is dark.
      lit[i] = style === "fill" ? (isInk ? 0 : 1) : (isInk ? 1 : 0);
    }
  }
  return pictureWidth;
}

// The still picture with the shine at frame f. Inside the stripes the picture flips
// (white turns black, black turns white), which reads as a glare on a 1 bit screen.
function drawFrame(f) {
  const out = lit.slice();
  if (f >= SHINE_FRAMES) return out;
  const travel = SCREEN_WIDTH + SCREEN_HEIGHT * SHINE_SLANT + 16;
  const front = -8 + travel * (f / SHINE_FRAMES);
  for (let y = 0; y < SCREEN_HEIGHT; y++) {
    for (let x = 0; x < SCREEN_WIDTH; x++) {
      const i = y * SCREEN_WIDTH + x;
      if (!shape[i]) continue;
      const behind = front - (x + (SCREEN_HEIGHT - 1 - y) * SHINE_SLANT);
      const wide = behind >= 0 && behind < SHINE_WIDTH;
      const thin = behind >= SHINE_WIDTH + SHINE_GAP && behind < SHINE_WIDTH + SHINE_GAP + 1;
      if (wide || thin) out[i] ^= 1;
    }
  }
  return out;
}

function paint(pixels) {
  const image = ctx.createImageData(SCREEN_WIDTH, SCREEN_HEIGHT);
  for (let i = 0; i < pixels.length; i++) {
    image.data[i * 4] = pixels[i] ? 236 : 0;
    image.data[i * 4 + 1] = pixels[i] ? 244 : 0;
    image.data[i * 4 + 2] = pixels[i] ? 255 : 0;
    image.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(image, 0, 0);
}

// The still picture as an Adafruit GFX bitmap (rows, 8 pixels per byte, left pixel first).
function arduinoCode(pictureWidth) {
  const out = [];
  for (let y = 0; y < SCREEN_HEIGHT; y++) {
    const row = [];
    for (let b = 0; b < SCREEN_WIDTH / 8; b++) {
      let value = 0;
      for (let bit = 0; bit < 8; bit++) {
        if (lit[y * SCREEN_WIDTH + b * 8 + bit]) value |= 0x80 >> bit;
      }
      row.push("0x" + value.toString(16).padStart(2, "0"));
    }
    out.push("  " + row.join(", "));
  }
  const rotate = mode === "portrait" ? "// Portrait: call display.setRotation(1); before drawing.\n" : "";
  return "// Messi, " + pictureWidth + "x" + pictureHeight + " picture on a " + SCREEN_WIDTH + "x" + SCREEN_HEIGHT + " screen, " + style + " style\n" + rotate +
    "const int MESSI_WIDTH = " + SCREEN_WIDTH + ";\n" +
    "const int MESSI_HEIGHT = " + SCREEN_HEIGHT + ";\n\n" +
    "const unsigned char messiBitmap[] PROGMEM = {\n" + out.join(",\n") + "\n};\n\n" +
    "// display.clearDisplay();\n" +
    "// display.drawBitmap(0, 0, messiBitmap, MESSI_WIDTH, MESSI_HEIGHT, SSD1306_WHITE);\n" +
    "// display.display();\n";
}

const sizeSlider = document.getElementById("size");

// Largest picture height that still fits the screen in the current direction.
function maxHeight() {
  return Math.min(SCREEN_HEIGHT, Math.floor(SCREEN_WIDTH * TRACE.h / TRACE.w));
}

function setMode(newMode) {
  mode = newMode;
  SCREEN_WIDTH = SCREENS[mode].w;
  SCREEN_HEIGHT = SCREENS[mode].h;
  canvas.width = SCREEN_WIDTH;
  canvas.height = SCREEN_HEIGHT;
  canvas.style.width = SCREEN_WIDTH * SCALE + "px";
  document.getElementById("meta").textContent = SCREEN_WIDTH + " x " + SCREEN_HEIGHT + " OLED, 1 bit";
  sizeSlider.max = maxHeight();
  pictureHeight = maxHeight();
  sizeSlider.value = pictureHeight;
  for (const b of document.querySelectorAll("[data-mode]")) b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
  refresh();
}

function refresh() {
  const pictureWidth = buildPicture();
  frame = 0;
  paint(lit);
  document.getElementById("sizeValue").textContent = pictureWidth + " x " + pictureHeight + " px";
  document.getElementById("code").textContent = arduinoCode(pictureWidth);
  for (const b of document.querySelectorAll("[data-style]")) b.setAttribute("aria-pressed", String(b.dataset.style === style));
}

sizeSlider.addEventListener("input", () => { pictureHeight = Number(sizeSlider.value); refresh(); });
for (const b of document.querySelectorAll("[data-style]")) {
  b.addEventListener("click", () => { style = b.dataset.style; refresh(); });
}
for (const b of document.querySelectorAll("[data-mode]")) {
  b.addEventListener("click", () => setMode(b.dataset.mode));
}
setMode(mode);

const copyButton = document.getElementById("copy");
copyButton.addEventListener("click", async () => {
  const text = document.getElementById("code").textContent;
  try {
    await navigator.clipboard.writeText(text);
  } catch (err) {
    const area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
  copyButton.textContent = "Copied";
  setTimeout(() => { copyButton.textContent = "Copy"; }, 1200);
});

function tick() {
  paint(drawFrame(frame));
  frame = (frame + 1) % (SHINE_FRAMES + REST_FRAMES);
}
// With reduced motion on, the picture stays completely still.
if (!reducedMotion) setInterval(tick, 1000 / FPS);
</script>
