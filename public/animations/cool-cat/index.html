AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAEAC3d//3////9//////Lb6/////z9///29P//SQAGAAAAAAAAAAAIALH//v///v7//////vv8/v/////+////shkAAwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACAAMAMNT///z+//76+fr////8+fv/////+f//eQEEAwAAAAAAAAAAAAFC7v/8///++vn5/P7//////fz9///ZVwwAAwQBAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAwAQp/X//vn9/////f39/v/////9+f/0eAAGCQAAAAAAAAAAAAAABIH///r7/f///////vv5+v///+h3CgAAAgABBAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABAABJvv////n6/P7////+/fv5///RSQABAAAAAAAAAAAAAAAAAAANe+L////8+fn5+v/////svpMZAAABAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACAABjg97///////3+/////+iHGAABAAAAAAAAAAAAAAAAAAAAAAAvhLPl///////zvId3QQAAAAMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMEAAAoSl+h2/7///bDcEktAAADAAAAAAAAAAAAAAAAAAAAAAECAAALLEJJSUlHMhAAAAACBgEAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQQFAAAABBIaHRwYDAAAAAQCAAAAAAAAAAAAAAAAAAAAAAAAAAMEAAAAAAAAAAAABAYDAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAMEAgAAAAAAAAABBAIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAECAwQEBAMDAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAECAQABAQEBAQEBAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"
};

// The tail, in master pixels. Everything right of the tail's base is tail (the body never
// reaches past it), so the tail can be lifted off the drawing and moved on its own.
//   base   x where the tail joins the body: it does not move there
//   tip    x of the tail's tip: it moves fully there
//   pivot  the point the tail swings around, on the ground at its base
const TAIL = { base: 168, tip: 270, pivot: [168, 168] };

// Portrait is the same 128x64 screen turned upright (display.setRotation(1) on the Arduino).
// The cat is wide, so landscape gives it more pixels.
const SCREENS = { portrait: { w: 64, h: 128 }, landscape: { w: 128, h: 64 } };
let mode = "landscape";
let SCREEN_WIDTH = SCREENS[mode].w;
let SCREEN_HEIGHT = SCREENS[mode].h;
const SCALE = 5;              // how big one OLED pixel is on this page
const FPS = 12;

// Starting values. The controls on the page change them.
let pictureHeight = 64;       // picture height in OLED pixels (largest that fits the screen)
let style = "fill";           // "fill" looks like the drawing, "line" lights the ink instead
let paused = false;

const INK_LEVEL = 0.18;       // how much ink a pixel needs to count as ink

// One tail move: it lifts and slaps back down on the ground, then rubs along the ground
// twice. After that the cat sits still for a moment and it all starts again.
const MOVE_FRAMES = 20;       // drawings in one tail move
const REST_FRAMES = 10;       // still drawings after it (the first drawing, held)
const LIFT_SHARE = 0.4;       // share of the move spent lifting and dropping, the rest is rubbing
const LIFT_ANGLE = 20;        // degrees the tail tip swings up
const RUB_REACH = 4;          // master pixels the tip slides along the ground, each way

const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if (reducedMotion) paused = true;
const master = Uint8Array.from(atob(TRACE.ink), c => c.charCodeAt(0));
let frames = [];              // the tail move, one byte per OLED pixel per drawing
let pictureWidth = 0;
let frame = 0;

// How much a point of the tail follows the move (0 = still, 1 = full), from where it sits.
// It grows smoothly from the base to the tip, so the tail bends instead of snapping.
function follow(x) {
  const p = Math.min(1, Math.max(0, (x - TAIL.base) / (TAIL.tip - TAIL.base)));
  return p * p * (3 - 2 * p);
}

// Where the tail is in drawing f: how far it swings up (radians) and slides (master pixels).
function tailPose(f) {
  const p = f / MOVE_FRAMES;
  let lift = 0, rub = 0;
  if (p < LIFT_SHARE) lift = Math.sin(Math.PI * p / LIFT_SHARE);
  else rub = Math.sin(2 * Math.PI * 2 * (p - LIFT_SHARE) / (1 - LIFT_SHARE));
  return { angle: -LIFT_ANGLE * Math.PI / 180 * lift, slide: RUB_REACH * rub };
}

// The master trace with the tail moved to drawing f.
function posedMaster(f) {
  const { angle, slide } = tailPose(f);
  const out = master.slice();
  if (angle === 0 && slide === 0) return out;
  const [px, py] = TAIL.pivot;
  for (let y = 0; y < TRACE.h; y++) {
    for (let x = TAIL.base; x < TRACE.w; x++) {
      // Find which point of the still tail lands here. How far a point moves depends on
      // where it started, so start with a guess and correct it a few times.
      let sx = x, sy = y;
      for (let k = 0; k < 4; k++) {
        const w = follow(sx);
        const a = -angle * w;   // turn back by the swing
        const dx = x - slide * w - px, dy = y - py;
        sx = px + dx * Math.cos(a) - dy * Math.sin(a);
        sy = py + dx * Math.sin(a) + dy * Math.cos(a);
      }
      const rx = Math.round(sx), ry = Math.round(sy);
      const inside = rx >= TAIL.base && ry >= 0 && rx < TRACE.w && ry < TRACE.h;
      out[y * TRACE.w + x] = inside ? master[ry * TRACE.w + rx] : 0;
    }
  }
  return out;
}

// Shrink a master picture to pictureHeight and centre it on the screen.
function buildPicture(source) {
  const scale = pictureHeight / TRACE.h;
  pictureWidth = Math.round(TRACE.w * scale);
  const left = Math.floor((SCREEN_WIDTH - pictureWidth) / 2);
  const top = Math.floor((SCREEN_HEIGHT - pictureHeight) / 2);
  const lit = new Uint8Array(SCREEN_WIDTH * SCREEN_HEIGHT);

  for (let y = 0; y < pictureHeight; y++) {
    const y0 = Math.floor(y / scale);
    const y1 = Math.min(TRACE.h, Math.max(y0 + 1, Math.round((y + 1) / scale)));
    for (let x = 0; x < pictureWidth; x++) {
      const x0 = Math.floor(x / scale);
      const x1 = Math.min(TRACE.w, Math.max(x0 + 1, Math.round((x + 1) / scale)));
      // Average the ink of all master pixels that land on this OLED pixel.
      let sum = 0;
      for (let my = y0; my < y1; my++) {
        for (let mx = x0; mx < x1; mx++) sum += source[my * TRACE.w + mx];
      }
      const isInk = sum / ((y1 - y0) * (x1 - x0)) / 255 > INK_LEVEL;
      // Fill: paper is white and ink is dark, like the drawing. Line: the ink is lit.
      lit[(top + y) * SCREEN_WIDTH + left + x] = style === "fill" ? (isInk ? 0 : 1) : (isInk ? 1 : 0);
    }
  }
  return lit;
}

function paint(pixels) {
  const image = ctx.createImageData(SCREEN_WIDTH, SCREEN_HEIGHT);
  for (let i = 0; i < pixels.length; i++) {
    image.data[i * 4] = pixels[i] ? 236 : 0;
    image.data[i * 4 + 1] = pixels[i] ? 244 : 0;
    image.data[i * 4 + 2] = pixels[i] ? 255 : 0;
    image.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(image, 0, 0);
}

// One drawing as Adafruit GFX bitmap bytes (rows, 8 pixels per byte, left pixel first).
function bitmapBytes(lit) {
  const out = [];
  for (let y = 0; y < SCREEN_HEIGHT; y++) {
    const row = [];
    for (let b = 0; b < SCREEN_WIDTH / 8; b++) {
      let value = 0;
      for (let bit = 0; bit < 8; bit++) {
        if (lit[y * SCREEN_WIDTH + b * 8 + bit]) value |= 0x80 >> bit;
      }
      row.push("0x" + value.toString(16).padStart(2, "0"));
    }
    out.push("    " + row.join(", "));
  }
  return out.join(",\n");
}

// All drawings of the tail move, ready to paste into a sketch.
function arduinoCode() {
  const blocks = frames.map((lit, i) => "  { // drawing " + (i + 1) + "\n" + bitmapBytes(lit) + "\n  }");
  const frameMs = Math.round(1000 / FPS);
  const rotate = mode === "portrait" ? "// Portrait: call display.setRotation(1); before drawing.\n" : "";
  return "// Cool Cat, " + pictureWidth + "x" + pictureHeight + " picture on a " + SCREEN_WIDTH + "x" + SCREEN_HEIGHT + " screen, " + style + " style, " +
    MOVE_FRAMES + " drawings at " + FPS + " fps\n" + rotate +
    "const int CAT_WIDTH = " + SCREEN_WIDTH + ";\n" +
    "const int CAT_HEIGHT = " + SCREEN_HEIGHT + ";\n" +
    "const int CAT_FRAMES = " + MOVE_FRAMES + ";\n" +
    "const int CAT_FRAME_MS = " + frameMs + ";\n" +
    "const int CAT_REST_MS = " + REST_FRAMES * frameMs + ";   // cat sits still between two tail moves\n\n" +
    "const unsigned char catFrames[CAT_FRAMES][" + SCREEN_WIDTH * SCREEN_HEIGHT / 8 + "] PROGMEM = {\n" + blocks.join(",\n") + "\n};\n\n" +
    "// In loop():\n" +
    "// for (int i = 0; i < CAT_FRAMES; i++) {\n" +
    "//   display.clearDisplay();\n" +
    "//   display.drawBitmap(0, 0, catFrames[i], CAT_WIDTH, CAT_HEIGHT, SSD1306_WHITE);\n" +
    "//   display.display();\n" +
    "//   delay(CAT_FRAME_MS);\n" +
    "// }\n" +
    "// display.clearDisplay();\n" +
    "// display.drawBitmap(0, 0, catFrames[0], CAT_WIDTH, CAT_HEIGHT, SSD1306_WHITE);\n" +
    "// display.display();\n" +
    "// delay(CAT_REST_MS);\n";
}

const sizeSlider = document.getElementById("size");

// Largest picture height that still fits the screen in the current direction.
function maxHeight() {
  return Math.min(SCREEN_HEIGHT, Math.floor(SCREEN_WIDTH * TRACE.h / TRACE.w));
}

function setMode(newMode) {
  mode = newMode;
  SCREEN_WIDTH = SCREENS[mode].w;
  SCREEN_HEIGHT = SCREENS[mode].h;
  canvas.width = SCREEN_WIDTH;
  canvas.height = SCREEN_HEIGHT;
  canvas.style.width = SCREEN_WIDTH * SCALE + "px";
  document.getElementById("meta").textContent = SCREEN_WIDTH + " x " + SCREEN_HEIGHT + " OLED, 1 bit";
  sizeSlider.max = maxHeight();
  pictureHeight = maxHeight();
  sizeSlider.value = pictureHeight;
  for (const b of document.querySelectorAll("[data-mode]")) b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
  refresh();
}

// The tail move is only 20 drawings, so they are made once and then just shown in turn.
function refresh() {
  frames = [];
  for (let f = 0; f < MOVE_FRAMES; f++) frames.push(buildPicture(posedMaster(f)));
  frame = 0;
  paint(frames[0]);
  document.getElementById("sizeValue").textContent = pictureWidth + " x " + pictureHeight + " px";
  document.getElementById("code").textContent = arduinoCode();
  for (const b of document.querySelectorAll("[data-style]")) b.setAttribute("aria-pressed", String(b.dataset.style === style));
}

sizeSlider.addEventListener("input", () => { pictureHeight = Number(sizeSlider.value); refresh(); });
for (const b of document.querySelectorAll("[data-style]")) {
  b.addEventListener("click", () => { style = b.dataset.style; refresh(); });
}
for (const b of document.querySelectorAll("[data-mode]")) {
  b.addEventListener("click", () => setMode(b.dataset.mode));
}
const pauseButton = document.getElementById("pause");
function showPause() { pauseButton.textContent = paused ? "Play" : "Pause"; }
pauseButton.addEventListener("click", () => { paused = !paused; showPause(); });
showPause();
setMode(mode);

const copyButton = document.getElementById("copy");
copyButton.addEventListener("click", async () => {
  const text = document.getElementById("code").textContent;
  try {
    await navigator.clipboard.writeText(text);
  } catch (err) {
    const area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
  copyButton.textContent = "Copied";
  setTimeout(() => { copyButton.textContent = "Copy"; }, 1200);
});

// Play the tail move, then hold the first drawing for the rest frames.
function tick() {
  if (paused) return;
  frame = (frame + 1) % (MOVE_FRAMES + REST_FRAMES);
  paint(frames[frame < MOVE_FRAMES ? frame : 0]);
}
// With reduced motion on, the cat starts paused.
setInterval(tick, 1000 / FPS);
</script>
