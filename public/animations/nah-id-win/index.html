      ".........................................ooiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiioo...........................................",
      ".........................................ooiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiio............................................",
      "..........................................oiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiioo............................................",
      "..........................................oooiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiioo.............................................",
      "............................................oooiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiio..............................................",
      ".............................................ooooiiiiiiiiiiiiiiiiiiiiiiiiiiiiiiio...............................................",
      "................................................oooiiiiiiiiiiiiiiiiiiiiiiiiiiiioo...............................................",
      "..................................................oooiiiiiiiiiiiiiiiiiiiiiiiiioo................................................",
      "....................................................oooiiiiiiiiiiiiiiiiiiiiiiio.................................................",
      ".......................................................oooiiiiiiiiiiiiiiiiiiooo.................................................",
      ".........................................................oiiiiiiiiiiiiiioooooo..................................................",
      ".........................................................oiiiiiioooooooooo......................................................",
      ".........................................................oiiiiiooooooo..........................................................",
      "........................................................oiiiiio.................................................................",
      "........................................................oiiioo..................................................................",
      "........................................................oiioo...................................................................",
      "........................................................oioo....................................................................",
      ".........................................................o......................................................................",
      ".......................................................oo......................................................................."
    ]
  }
};

const SCALE = 5;            // how big one OLED pixel is on this page
const FPS = 30;

// Which traced characters are lit in each style
const LIT = { line: "o123", fill: "oi" };

// The picture stays still. Only a shine slides across it.
const SHINE_FRAMES = 22;    // how long the shine takes to cross the screen
const REST_FRAMES = 75;     // still picture between two shines
const SHINE_WIDTH = 4;      // wide stripe, in pixels
const SHINE_GAP = 3;        // gap before the thin second stripe
const SHINE_SLANT = 0.5;    // how much the stripes lean

const canvas = document.getElementById("screen");
const ctx = canvas.getContext("2d");
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

let mode = "portrait";
let style = "line";
let frame = 0;
let layout = null;

// Build the still picture: one byte per pixel, plus which pixels belong to the drawing.
function prepare(trace) {
  const W = trace.w, H = trace.h;
  const lit = new Uint8Array(W * H);
  const shape = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const ch = trace.rows[y][x];
      if (ch === ".") continue;
      shape[y * W + x] = 1;
      if (LIT[style].includes(ch)) lit[y * W + x] = 1;
    }
  }
  return { W, H, lit, shape };
}

// The still picture with the shine at frame f. Inside the stripes the drawing flips
// (white turns black, black turns white), which reads as a glare on a 1 bit screen.
function drawFrame(f) {
  const { W, H, lit, shape } = layout;
  const out = lit.slice();
  if (f >= SHINE_FRAMES) return out;

  const travel = W + H * SHINE_SLANT + 16;
  const front = -8 + travel * (f / SHINE_FRAMES);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      if (!shape[y * W + x]) continue;
      const behind = front - (x + (H - 1 - y) * SHINE_SLANT);
      const wide = behind >= 0 && behind < SHINE_WIDTH;
      const thin = behind >= SHINE_WIDTH + SHINE_GAP && behind < SHINE_WIDTH + SHINE_GAP + 1;
      if (wide || thin) out[y * W + x] ^= 1;
    }
  }
  return out;
}

function paint(lit) {
  const { W, H } = layout;
  const image = ctx.createImageData(W, H);
  for (let i = 0; i < W * H; i++) {
    const on = lit[i];
    image.data[i * 4] = on ? 236 : 0;
    image.data[i * 4 + 1] = on ? 244 : 0;
    image.data[i * 4 + 2] = on ? 255 : 0;
    image.data[i * 4 + 3] = 255;
  }
  ctx.putImageData(image, 0, 0);
}

// The still picture as an Adafruit GFX bitmap (rows, 8 pixels per byte, left pixel first).
function arduinoCode() {
  const { W, H, lit } = layout;
  const bytesPerRow = Math.ceil(W / 8);
  const out = [];
  for (let y = 0; y < H; y++) {
    const row = [];
    for (let b = 0; b < bytesPerRow; b++) {
      let value = 0;
      for (let bit = 0; bit < 8; bit++) {
        const x = b * 8 + bit;
        if (x < W && lit[y * W + x]) value |= 0x80 >> bit;
      }
      row.push("0x" + value.toString(16).padStart(2, "0"));
    }
    out.push("  " + row.join(", "));
  }
  const rotate = mode === "portrait"
    ? "// Portrait: call display.setRotation(1); before drawing.\n"
    : "";
  return "// Nah, I'd Win, " + W + "x" + H + ", " + style + " style\n" + rotate +
    "const int BUBBLE_WIDTH = " + W + ";\n" +
    "const int BUBBLE_HEIGHT = " + H + ";\n\n" +
    "const unsigned char bubbleBitmap[] PROGMEM = {\n" + out.join(",\n") + "\n};\n\n" +
    "// display.clearDisplay();\n" +
    "// display.drawBitmap(0, 0, bubbleBitmap, BUBBLE_WIDTH, BUBBLE_HEIGHT, SSD1306_WHITE);\n" +
    "// display.display();\n";
}

function refresh() {
  layout = prepare(TRACE[mode]);
  canvas.width = layout.W;
  canvas.height = layout.H;
  canvas.style.width = layout.W * SCALE + "px";
  document.getElementById("meta").textContent = layout.W + " x " + layout.H + " OLED, 1 bit";
  document.getElementById("code").textContent = arduinoCode();
  for (const b of document.querySelectorAll("[data-mode]")) b.setAttribute("aria-pressed", String(b.dataset.mode === mode));
  for (const b of document.querySelectorAll("[data-style]")) b.setAttribute("aria-pressed", String(b.dataset.style === style));
  frame = 0;
  paint(layout.lit);
}

for (const b of document.querySelectorAll("[data-mode]")) {
  b.addEventListener("click", () => { mode = b.dataset.mode; refresh(); });
}
for (const b of document.querySelectorAll("[data-style]")) {
  b.addEventListener("click", () => { style = b.dataset.style; refresh(); });
}

const copyButton = document.getElementById("copy");
copyButton.addEventListener("click", async () => {
  const text = document.getElementById("code").textContent;
  try {
    await navigator.clipboard.writeText(text);
  } catch (err) {
    const area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
  copyButton.textContent = "Copied";
  setTimeout(() => { copyButton.textContent = "Copy"; }, 1200);
});

function tick() {
  paint(drawFrame(frame));
  frame = (frame + 1) % (SHINE_FRAMES + REST_FRAMES);
}

refresh();
// With reduced motion on, the picture stays completely still.
if (!reducedMotion) setInterval(tick, 1000 / FPS);
</script>
</body>
</html>
